name: Check and publish coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Rebuild the pinned dataset and publish to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e '.[test]'
      - run: npm ci
      - run: ruff check . && ruff format --check . && pytest -q
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Save browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-check-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: fire-coverage-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -e .
      - run: npm ci
      - name: Restore verified source snapshot
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
            --output coverage-sources-0001.tar.gz \
            https://github.com/jmacd/mendo-coast-fire/releases/download/source-data-0001/coverage-sources-0001.tar.gz
          echo "5dec50697f11d085772a0fbfc00c8d9e5841527733d0f0bf17b83e9b77f00de3  coverage-sources-0001.tar.gz" | sha256sum --check --strict
          mkdir -p "$GITHUB_WORKSPACE/data"
          tar -xzf coverage-sources-0001.tar.gz --no-same-owner -C "$GITHUB_WORKSPACE/data"
      - run: fire-coverage analyze
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify the production dataset and map
        run: npm run test:browser -- tests/browser/real-data.spec.js
        env:
          FIRE_SITE_PREVIEW: "1"
      - name: Save production browser failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-production-failure
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
